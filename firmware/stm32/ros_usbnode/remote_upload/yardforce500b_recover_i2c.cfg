# STM32F401 / Yardforce 500B only: recover onboard LIS3DH I2C1 (PB6/PB7).
# Stop the ROS bridge first, keep blades removed and back up installed firmware.
# No flash writes. A failed line check leaves the CPU halted: investigate before resuming.
# Uses ITM-off SWD so PB3 remains available to the separate external IMU bus.
source [find interface/stlink.cfg]
transport select swd
adapter speed 100
reset_config none
source [find target/swj-dp.tcl]
source [find mem_helper.tcl]
swj_newdap mower cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id 0x2ba01477
dap create mower.dap -chain-position mower.cpu
target create mower.cpu cortex_m -endian little -dap mower.dap
# Cortex-M target creation defaults ITM stimulus port 0 ON, even without a TPIU.
# Disable it before init; otherwise undrained debug_printf can trip WWDG.
itm ports off
mower.cpu configure -work-area-phys 0x20000000 -work-area-size 0x4000 -work-area-backup 0
flash bank mower.flash stm32f2x 0 0 0 0 mower.cpu
cortex_m reset_config sysresetreq
mower.cpu configure -event examine-end {
    mww 0xE0042004 0
    # Freeze watchdogs while halted for flashing, not while the mower runs.
    mmw 0xE0042008 0x1800 0
}
gdb port disabled
tcl port disabled
telnet port disabled
init
if {([mrw 0xE0042000] & 0xfff) != 0x423} {
    error "Expected STM32F401xB/C device ID 0x423"
}
reset halt
# Recover LIS3DH I2C1 on PB6=SCL, PB7=SDA, with the CPU halted and PWM reset.
# Both pins are open-drain: high always means release, never push-pull drive.
mmw 0x40023830 0x2 0
mww 0x40020418 0xc0
mmw 0x40020404 0xc0 0
mmw 0x4002040c 0x5000 0xf000
mmw 0x40020400 0x5000 0xf000
sleep 2
if {([mrw 0x40020410] & 0x40) == 0} {error "I2C1 SCL held low; stop recovery"}
for {set i 0} {$i < 9} {incr i} {
    mww 0x40020418 0x00400000
    sleep 2
    mww 0x40020418 0x40
    sleep 2
    if {([mrw 0x40020410] & 0x40) == 0} {error "I2C1 SCL not released"}
}
# STOP: SDA low while SCL low, then release SCL before releasing SDA.
mww 0x40020418 0x00400000
mww 0x40020418 0x00800000
sleep 2
mww 0x40020418 0x40
sleep 2
mww 0x40020418 0x80
sleep 2
if {([mrw 0x40020410] & 0xc0) != 0xc0} {error "I2C1 bus still held; CPU left halted"}
echo "I2C1 PB6/PB7 released; restarting firmware"
mww 0xE0042004 0
reset run
shutdown
