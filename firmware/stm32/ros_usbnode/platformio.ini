; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = Yardforce500

[env]
platform = ststm32
framework = stm32cube
build_src_filter =
	+<*>
	-<.git/>
	-<.svn/>
	-<proxy_inc/**/*.c>
	-<proxy_inc/**/*.S>
	-<ros/ros_lib_backup_*>
	-<ros/ros_lib/**>
	-<ros/ros_lib>

[env:Yardforce500]
board = genericSTM32F103VC
platform_packages = 
    toolchain-gccarmnoneeabi@~1.90301.0
	platformio/tool-stm32duino@^1.0.1
	platformio/tool-openocd@^2.1100.211028
	platformio/tool-dfuutil@^1.11.0
build_flags = -DBOARD_YARDFORCE500_VARIANT_ORIG=1 -Wl,--undefined,_printf_float  -O2 -Isrc/ros/ros_custom -Iinclude
extra_scripts =
	pre:patch_usb.py
	pre:add_swo_viewer.py
debug_tool = stlink
monitor_speed = 115200
monitor_port = /dev/ttyAMA0

[env:Yardforce500B]
board = genericSTM32F401VC
platform_packages =
	toolchain-gccarmnoneeabi@~1.90301.0
	platformio/tool-stm32duino@^1.0.1
	platformio/tool-openocd@^2.1100.211028
	platformio/tool-dfuutil@^1.11.0
	platformio/framework-stm32cubef4@^1.26.2
build_flags = -DBOARD_YARDFORCE500_VARIANT_B=1 -Wl,--undefined,_printf_float  -O2 -Isrc/ros/ros_custom -Iinclude -DHSE_VALUE=8000000u
extra_scripts =
	pre:patch_usb.py
	pre:add_swo_viewer.py
debug_tool = stlink
monitor_speed = 115200
monitor_port = /dev/ttyAMA0

[env:Yardforce500B_LFP]
; Yardforce 500B built for an 8S LiFePO4 pack + bump-sensor mod (CLOUDY).
; Identical board to Yardforce500B, plus -DBOARD_YARDFORCE500B_LFP=1 which selects the
; LFP charge profile and the blue-wheel-lift-as-bump remap in board.h / charger.c / drivemotor.c.
; The plain Yardforce500B env stays byte-for-byte upstream.
;
; --- FLASHING (IMPORTANT): POWER-CYCLE THE BOARD AFTER EVERY FLASH -----------------
; The MPU6050 IMU is on the J18 soft-I2C bus whose SCL is PB3 - which is also SWD
; TRACESWO. openocd turns on SWO trace at flash time and drives PB3, garbling the IMU.
; DBGMCU (TRACE_IOEN) clears only on a power-on reset, so a warm/soft reset after a
; flash leaves the IMU undetected: long boot beep, and the ROS2 host reboot-loops the
; board on the resulting NaN/0 telemetry. A clean HARD BOOT recovers it. main.c also
; clears TRACE_IOEN at boot as a backstop, but that cannot undo a garble that already
; happened during the flash.
; To minimise trace on PB3 during a direct openocd flash, disable the TPIU (still
; hard-boot afterwards - this suppression is not 100% reliable):
;   openocd -f interface/stlink.cfg -f target/stm32f4x.cfg \
;     -c "stm32f4x.tpiu configure -event pre-enable {}" -c "init" \
;     -c "catch {stm32f4x.tpiu disable}" \
;     -c "program .pio/build/Yardforce500B_LFP/firmware.elf verify" \
;     -c "mww 0xE0042004 0" -c "reset run" -c "shutdown"
; ----------------------------------------------------------------------------------
board = genericSTM32F401VC
platform_packages =
	toolchain-gccarmnoneeabi@~1.90301.0
	platformio/tool-stm32duino@^1.0.1
	platformio/tool-openocd@^2.1100.211028
	platformio/tool-dfuutil@^1.11.0
	platformio/framework-stm32cubef4@^1.26.2
build_flags = -DBOARD_YARDFORCE500_VARIANT_B=1 -DBOARD_YARDFORCE500B_LFP=1 -Wl,--undefined,_printf_float  -O2 -Isrc/ros/ros_custom -Iinclude -DHSE_VALUE=8000000u
extra_scripts =
	pre:patch_usb.py
	pre:add_swo_viewer.py
debug_tool = stlink
monitor_speed = 115200
monitor_port = /dev/ttyAMA0

[env:Yardforce500_REMOTE_UPLOAD]
board = genericSTM32F103VC
build_flags = -DBOARD_YARDFORCE500_VARIANT_ORIG=1 -Wl,--undefined,_printf_float -Isrc/ros/ros_custom -Iinclude
extra_scripts = raspi_remote_upload.py
custom_mowgli_host = 10.146.111.222
custom_mowgli_user = ubuntu
